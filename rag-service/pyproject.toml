[project]
name = "keystreet-rag"
version = "0.1.0"
description = "Key Street — microservicio RAG (FastAPI + LangChain + Gemini)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requiere GEMINI_API_KEY real",
  "ocr: requiere Tesseract instalado (ejecutar en contenedor)",
]
