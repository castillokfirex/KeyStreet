[project]
name = "keystreet-rag"
version = "0.1.0"
description = "Key Street — microservicio RAG (FastAPI + LangChain + Gemini)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-google-genai>=2.0",
  "pymupdf>=1.24",
  "pytesseract>=0.3.13",
  "pillow>=10.4",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3.6",
  "numpy>=1.26",
  "tenacity>=9.0",
  "structlog>=24.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "testcontainers>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-Pillow",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: requiere GEMINI_API_KEY real",
  "ocr: requiere Tesseract instalado (ejecutar en contenedor)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
