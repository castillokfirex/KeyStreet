spring:
  application:
    name: keystreet-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/keystreet}
    username: ${SPRING_DATASOURCE_USERNAME:keystreet_app}
    password: ${SPRING_DATASOURCE_PASSWORD:dev-only-password}
    hikari:
      maximum-pool-size: 15
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_PDF_MB:20}MB
      max-request-size: ${MAX_PDF_MB:20}MB
      file-size-threshold: 1MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}

keystreet:
  default-tenant-slug: ${DEFAULT_TENANT_SLUG:key-street}
  whatsapp-phone: ${WHATSAPP_PHONE:573176576059}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: keystreet
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    internal-api-token: ${INTERNAL_API_TOKEN}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost,http://localhost:5173,http://localhost:8080}
    cookie-secure: ${COOKIE_SECURE:false}
    require-https-upload: ${REQUIRE_HTTPS:false}
    rate-limit-enabled: ${RATE_LIMIT_ENABLED:true}
  rag:
    base-url: ${RAG_BASE_URL:http://localhost:8000}
    timeout-seconds: ${RAG_TIMEOUT_SECONDS:30}
  pdf:
    tmp-dir: ${PDF_TMP_DIR:/var/keystreet/pdf-tmp}
    max-mb: ${MAX_PDF_MB:20}
    max-pages: ${MAX_PDF_PAGES:300}
    ttl-minutes: ${PDF_TMP_TTL_MINUTES:30}
    janitor-fixed-delay-ms: ${PDF_JANITOR_DELAY_MS:300000}
    clamav-enabled: ${CLAMAV_ENABLED:false}
    clamav-host: ${CLAMAV_HOST:clamav}
    clamav-port: ${CLAMAV_PORT:3310}
